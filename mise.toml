[tasks]
install = "uv sync --all-packages --group dev --group build"

lint = [
  "uv run ruff check --select E,F,W,I,B,UP,S,SIM,RUF .",
  "uv run ruff format --check .",
  "uv run mypy --strict packages",
]

fix = ["uv run ruff check --fix --unsafe-fixes .", "uv run ruff format ."]

# The fast suite is service-free. The integration task owns PostgreSQL.
test = "uv run pytest -n auto -m 'not integration'"
test-integration = "bash scripts/integration.sh"
db-migrate = "mise run db:migrate"

# Golden tests need GMT and ttt_client.
test-golden = "uv run pytest -m golden"

# Parity tests use frozen MATLAB fixtures and optional Fortran tools.
test-parity = "uv run pytest packages/tsdhn/tests/parity packages/tsdhn-parity/tests"

# Capture MATLAB checkpoints manually. See scripts/capture_matlab_fixtures.py.
parity-capture-matlab = "uv run python scripts/capture_matlab_fixtures.py"

# Disable Numba JIT so coverage.py can trace the tsunami kernels.
coverage = [
  "NUMBA_DISABLE_JIT=1 uv run coverage run -m pytest",
  "uv run coverage report",
  "uv run coverage json",
  "uv run coverage xml",
]

diff-coverage = [
  "mise run db:start",
  "mise run coverage",
  "uv run coverage run --append -m pytest -m integration packages/api/tests",
  "uv run coverage xml",
  "uv run diff-cover coverage.xml --compare-branch=origin/master --fail-under=90",
]

security = [
  "uv run bandit -r packages -lll --skip B101",
  "mise run audit",
  "mise run audit-toolchain",
  "gitleaks detect --source . --no-banner",
]

# Audit production dependencies.
audit = "uv audit --locked --preview-features audit-command --no-dev --no-group build"

# Audit development dependencies.
audit-toolchain = "uv audit --locked --preview-features audit-command"

build = [
  "uv build --package tsdhn --out-dir dist/tsdhn",
  "uv build --package tsdhn-api --out-dir dist/api",
]

api = { description = "Run the API against the local PostgreSQL", env = { _ = { file = ".env" } }, run = "uv run tsdhn-api" }
worker = { description = "Run the simulation worker against the local PostgreSQL", env = { _ = { file = ".env" } }, run = "uv run tsdhn-worker" }

web-install = "bun install"
web-dev = "bun --filter web dev"
web-build = "bun --filter web build"
web-check = "bun --filter web check"
web-test = "bun --filter web test"
lint-js = "bun run lint"
fmt-js = "bun run fmt"
fmt-check-js = "bun run fmt:check"
gen-client = "bun run gen:client"

diff-coverage-js = [
  "bun --filter web test:coverage",
  "sed -i.bak 's|^SF:|SF:apps/web/|' apps/web/coverage/lcov.info",
  "uv run diff-cover apps/web/coverage/lcov.info --compare-branch=origin/master --fail-under=90",
]

# PostgreSQL is managed by mise. Compose runs the service stack.
db = "mise run db:start"

dev-up = """
. scripts/dev-engine.sh
UV_VERSION="$(scripts/tool-version.sh uv)" docker compose up -d --build
"""
dev-web = """
. scripts/dev-engine.sh
UV_VERSION="$(scripts/tool-version.sh uv)" BUN_VERSION="$(scripts/tool-version.sh bun)" docker compose --profile web up -d --build
"""
dev-down = """
. scripts/dev-engine.sh
docker compose --profile web down
"""
dev-status = """
. scripts/dev-engine.sh
docker compose --profile web ps -a
for container in $(docker compose --profile web ps -aq); do
  name=$(docker inspect --format "$(printf '\\173\\173.Name\\175\\175')" "$container")
  state=$(docker inspect --format "$(printf '\\173\\173.State.Status\\175\\175')" "$container")
  health=$(docker inspect --format "$(printf '\\173\\173if .State.Health\\175\\175\\173\\173.State.Health.Status\\175\\175\\173\\173else\\175\\175not-configured\\173\\173end\\175\\175')" "$container")
  printf '%s state=%s health=%s\\n' "$name" "$state" "$health"
done
"""
dev-logs = """
. scripts/dev-engine.sh
docker compose --profile web logs -f
"""

env-init = """
if [ -e .env ] || [ -L .env ]; then
  echo "Refusing to overwrite existing .env" >&2
  exit 1
fi

umask 077
tmp_file="$(mktemp .env.XXXXXX)"
trap 'rm -f "$tmp_file"' EXIT
compute_api_token="$(openssl rand -hex 32)"
better_auth_secret="$(openssl rand -hex 32)"
app_db_password="$(openssl rand -hex 32)"
compute_producer_password="$(openssl rand -hex 32)"
compute_worker_password="$(openssl rand -hex 32)"
compute_purger_password="$(openssl rand -hex 32)"
awk \
  -v compute_api_token="$compute_api_token" \
  -v better_auth_secret="$better_auth_secret" \
  -v app_db_password="$app_db_password" \
  -v compute_producer_password="$compute_producer_password" \
  -v compute_worker_password="$compute_worker_password" \
  -v compute_purger_password="$compute_purger_password" '
  /^COMPUTE_API_TOKEN=/ { print "COMPUTE_API_TOKEN=" compute_api_token; next }
  /^BETTER_AUTH_SECRET=/ { print "BETTER_AUTH_SECRET=" better_auth_secret; next }
  /^APP_DB_PASSWORD=/ { print "APP_DB_PASSWORD=" app_db_password; next }
  /^COMPUTE_PRODUCER_PASSWORD=/ { print "COMPUTE_PRODUCER_PASSWORD=" compute_producer_password; next }
  /^COMPUTE_WORKER_PASSWORD=/ { print "COMPUTE_WORKER_PASSWORD=" compute_worker_password; next }
  /^COMPUTE_PURGER_PASSWORD=/ { print "COMPUTE_PURGER_PASSWORD=" compute_purger_password; next }
  { print }
' .env.example > "$tmp_file"
chmod 600 "$tmp_file"
mv "$tmp_file" .env
trap - EXIT
echo "Created .env with generated secrets (mode 600)."
"""

dev = """
if [ ! -e .env ]; then
  mise run env-init
fi

. scripts/dev-engine.sh
config_dir="$(mktemp -d "${TMPDIR:-/tmp}/tsdhn-dev.XXXXXX")"
docker_config="$config_dir/docker"
buildx_config="$config_dir/buildx"
trap 'rm -rf "$config_dir"' EXIT
mkdir -p "$docker_config" "$buildx_config"
UV_VERSION="$(scripts/tool-version.sh uv)" \
BUN_VERSION="$(scripts/tool-version.sh bun)" \
DOCKER_CONFIG="$docker_config" BUILDX_CONFIG="$buildx_config" \
docker compose --profile web up -d --build

for _ in $(seq 1 60); do
  health="$(curl -fsS http://localhost:8000/api/v1/health 2>/dev/null || true)"
  if echo "$health" | grep -q '"database_connected":true' \
    && echo "$health" | grep -q '"storage_connected":true' \
    && curl -fsS http://localhost:3000 >/dev/null; then
    echo "Web: http://localhost:3000"
    echo "API docs: http://localhost:8000/api-docs"
    echo "Storage console: http://localhost:9001"
    echo "Sign up at /signup to create a local account (email plus a password of at least 8 characters; no email verification)."
    exit 0
  fi
  sleep 2
done

echo "The local stack did not become healthy within 120 seconds." >&2
DOCKER_CONFIG="$docker_config" docker compose --profile web ps >&2 || true
exit 1
"""

lint-all = ["mise run lint", "mise run lint-js", "mise run fmt-check-js"]

check = [
  "mise run lint-all",
  "mise run test",
  "mise run web-check",
  "mise run web-test",
]
fix-all = ["mise run fix", "mise run fmt-js"]

doctor = [
  "uv run python --version",
  "uv --version",
  "uv run ruff --version",
  "uv run mypy --version",
  "gitleaks version",
]

# setup.sh creates this file when the scientific toolchain is installed.
[env]
_.file = ".tsdhn/env"

[tasks."web:preview"]
description = "Serve the web app on an embedded database and a stub compute API"
usage = '''
flag "--host <host>" default="0.0.0.0" help="Address to listen on"
flag "--port <port>" default="5174" help="Port to listen on"
'''
run = 'bun --filter web serve:preview --host "$usage_host" --port "$usage_port"'

[tasks."db:init"]
description = "Initialize the project-local PostgreSQL cluster"
run = """
data_dir="$PWD/.data/postgres"

if [ ! -f "$data_dir/PG_VERSION" ]; then
  mkdir -p "$data_dir"
  mise x postgres -- initdb -D "$data_dir" -U tsdhn \
    --auth-host=trust --auth-local=trust --no-instructions
fi
"""

[tasks."db:start"]
description = "Start the project-local PostgreSQL cluster"
depends = ["db:init"]
run = """
data_dir="$PWD/.data/postgres"
pg_port="${TSDHN_PG_PORT:-5432}"

project_server_running=0
if mise x postgres -- pg_ctl -D "$data_dir" status >/dev/null 2>&1; then
  project_server_running=1
fi

port_open=0
if nc -z -w 1 127.0.0.1 "$pg_port" >/dev/null 2>&1; then
  port_open=1
fi

if [ "$project_server_running" -eq 0 ] && [ "$port_open" -eq 1 ]; then
  echo "PostgreSQL port $pg_port is already in use by another server; set TSDHN_PG_PORT to an unused port." >&2
  exit 1
fi

if [ "$project_server_running" -eq 0 ]; then
  mise x postgres -- pg_ctl -D "$data_dir" \
    -l "$data_dir/server.log" \
    -o "-h 127.0.0.1 -p $pg_port -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \
    -w start
fi

if ! PGPASSWORD="${PGPASSWORD:-}" mise x postgres -- psql -w -h 127.0.0.1 -p "$pg_port" -U tsdhn -d tsdhn -qAtc "SELECT 1" >/dev/null 2>&1; then
  PGPASSWORD="${PGPASSWORD:-}" mise x postgres -- createdb -w -h 127.0.0.1 -p "$pg_port" -U tsdhn tsdhn
fi
"""

[tasks."db:stop"]
description = "Stop the project-local PostgreSQL cluster"
run = """
data_dir="$PWD/.data/postgres"
mise x postgres -- pg_ctl -D "$data_dir" stop -m fast -w 2>/dev/null || true
"""

[tasks."db:reset"]
description = "Delete the project-local PostgreSQL cluster"
run = """
mise run db:stop
rm -rf "$PWD/.data/postgres"
"""

[tasks."db:migrate"]
description = "Apply compute, queue, and web migrations to local PostgreSQL"
depends = ["db:start"]
env = { _ = { file = ".env" } }
run = [
  "uv run tsdhn-compute-migrate",
  "uv run rqueue --database-url \"${COMPUTE_DATABASE_URL:-postgresql://tsdhn:tsdhn@127.0.0.1:${TSDHN_PG_PORT:-5432}/tsdhn}\" --schema \"${COMPUTE_QUEUE_SCHEMA:-task_queue}\" migrate",
  "uv run tsdhn-queue-grants",
  "DATABASE_URL=\"${COMPUTE_DATABASE_URL:-postgresql://tsdhn:tsdhn@127.0.0.1:${TSDHN_PG_PORT:-5432}/tsdhn}\" bun --filter web db:migrate",
  "uv run tsdhn-web-grants",
]
