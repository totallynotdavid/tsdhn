[tools]
python = "3.14.8"
uv = "0.13.0"
bun = "1.4.2"
postgres = "18.6"

# setup.sh creates this file when the scientific toolchain is installed.
[env]
_.file = ".tsdhn/env"

[tasks.install]
description = "Install the Python and web dependencies from the lockfiles"
run = [
  "uv sync --locked --all-packages --all-groups",
  "bun install --frozen-lockfile",
]

[tasks.lint]
description = "Check Python, web code and Markdown without writing"
depends = ["lint:py", "lint:web"]

[tasks."lint:py"]
description = "Check Python with ruff"
run = ["uv run ruff check --no-fix .", "uv run ruff format --check ."]

[tasks."lint:web"]
description = "Check the web code, Markdown, YAML and JSON with oxlint and oxfmt"
run = ["bunx oxlint --deny-warnings", "bunx oxfmt --check ."]

[tasks.fix]
description = "Apply safe lint fixes and format the repository"
depends = ["fix:py", "fix:web"]

[tasks."fix:py"]
description = "Fix and format Python with ruff"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks."fix:web"]
description = "Fix and format the web code, Markdown, YAML and JSON"
run = ["bunx oxlint --fix", "bunx oxfmt ."]

[tasks.typecheck]
description = "Type-check Python and the web workspaces"
depends = ["typecheck:py", "typecheck:web"]

[tasks."typecheck:py"]
description = "Type-check Python with mypy"
run = "uv run mypy"

[tasks."typecheck:web"]
description = "Type-check the web workspaces"
run = "bun --filter '*' typecheck"

[tasks.test]
description = "Run the fast Python and web tests"
depends = ["test:py", "test:web"]

# Disable Numba JIT so coverage.py can trace the tsunami kernels. The run
# records .coverage for the diff-coverage tasks.
[tasks."test:py"]
description = "Run the Python tests that need no services and record coverage data"
env = { NUMBA_DISABLE_JIT = "1" }
run = "uv run pytest -n auto -m 'not integration' --cov --cov-report="

[tasks."test:web"]
description = "Run the web tests that need no services and record coverage data"
run = "bun --filter '*' test"

[tasks."test:integration"]
description = "Run the database-backed tests on a disposable database; pass -- --coverage to record coverage"
run = "bash scripts/integration.sh"

# Golden tests need GMT and ttt_client.
[tasks."test:golden"]
description = "Run the golden pipeline test against the real toolchain"
run = "uv run pytest -m golden"

# Parity tests use frozen MATLAB fixtures and optional Fortran tools.
[tasks."test:parity"]
description = "Compare Python checkpoints with the MATLAB and Fortran references"
run = "uv run pytest packages/tsdhn/tests/parity packages/tsdhn-parity/tests"

[tasks.build]
description = "Build the Python distributions and the web app"
depends = ["build:py", "build:web"]

[tasks."build:py"]
description = "Build the tsdhn and tsdhn-api distributions"
run = [
  "uv build --package tsdhn --out-dir dist/tsdhn",
  "uv build --package tsdhn-api --out-dir dist/api",
]

[tasks."build:web"]
description = "Build the web app"
# typecheck:web and test:web regenerate apps/web/.svelte-kit, which the build reads.
wait_for = ["typecheck:web", "test:web"]
run = "bun --filter web build"

[tasks.check]
description = "Run every check that needs no services; the entry for CI and for a contributor before a push"
depends = ["lint", "typecheck", "test", "build"]

[tasks."coverage:merge"]
description = "Combine the recorded Python coverage data into reports"
run = [
  "uv run coverage combine",
  "uv run coverage xml",
  "uv run coverage html --skip-covered --skip-empty",
  "uv run coverage report",
]

[tasks."diff-coverage:py"]
description = "Fail when changed Python lines fall under the coverage threshold in pyproject.toml"
run = "uv run diff-cover -c pyproject.toml coverage.xml --markdown-report diff-coverage.md"

[tasks."diff-coverage:web"]
description = "Fail when changed web lines fall under the coverage threshold in pyproject.toml; run test:web first"
run = [
  "sed 's|^SF:|SF:apps/web/|' apps/web/coverage/lcov.info > apps/web/coverage/lcov.repo.info",
  "uv run diff-cover -c pyproject.toml apps/web/coverage/lcov.repo.info --markdown-report diff-coverage-web.md",
]

[tasks.diff-coverage]
description = "Run the unit and integration tests, then check coverage of the changed Python lines"
run = [
  "mise run db:start",
  "mise run test:py",
  "uv run coverage run --append -m pytest -m integration packages/api/tests",
  "uv run coverage xml",
  "mise run diff-coverage:py",
]

[tasks."audit:runtime"]
description = "Audit the production Python dependencies"
run = "uv audit --locked --preview-features audit-command --no-dev --no-group build"

[tasks."audit:toolchain"]
description = "Audit the development Python dependencies"
run = "uv audit --locked --preview-features audit-command"

[tasks."gen:client"]
description = "Regenerate the TypeScript API client from the FastAPI schema"
run = "bun run scripts/gen-client.ts"

[tasks."capture:matlab"]
description = "Capture MATLAB checkpoints; see scripts/capture_matlab_fixtures.py"
run = "uv run python scripts/capture_matlab_fixtures.py"

[tasks.api]
description = "Run the API against the local PostgreSQL"
env = { _ = { file = ".env" } }
run = "uv run tsdhn-api"

[tasks.worker]
description = "Run the simulation worker against the local PostgreSQL"
env = { _ = { file = ".env" } }
run = "uv run tsdhn-worker"

[tasks."init:env"]
description = "Create .env with generated local secrets"
run = "scripts/env-init.sh .env"

[tasks.dev]
description = "Start the local stack and wait until the web app and API answer"
run = "scripts/dev.sh"

[tasks."dev:api"]
description = "Start the local stack without the web app"
run = """
. scripts/dev-engine.sh
UV_VERSION="$(mise current uv)" docker compose up -d --build
"""

[tasks."dev:web"]
description = "Start the local stack with the web app"
run = """
. scripts/dev-engine.sh
UV_VERSION="$(mise current uv)" BUN_VERSION="$(mise current bun)" docker compose --profile web up -d --build
"""

[tasks."dev:down"]
description = "Stop the local stack"
run = """
. scripts/dev-engine.sh
docker compose --profile web down
"""

[tasks."dev:status"]
description = "Show the state and health of the local stack containers"
run = "scripts/dev-status.sh"

[tasks."dev:logs"]
description = "Follow the local stack logs"
run = """
. scripts/dev-engine.sh
docker compose --profile web logs -f
"""

[tasks."preview:web"]
description = "Serve the web app on an embedded database and a stub compute API"
usage = '''
flag "--host <host>" default="0.0.0.0" help="Address to listen on"
flag "--port <port>" default="5174" help="Port to listen on"
'''
run = 'bun --filter web serve:preview --host "$usage_host" --port "$usage_port"'

[tasks.doctor]
description = "Print the versions of the Python toolchain"
run = [
  "uv run python --version",
  "uv --version",
  "uv run ruff --version",
  "uv run mypy --version",
]

[tasks."db:init"]
description = "Initialize the project-local PostgreSQL cluster"
run = """
data_dir="$PWD/.data/postgres"

if [ ! -f "$data_dir/PG_VERSION" ]; then
  mkdir -p "$data_dir"
  mise x postgres -- initdb -D "$data_dir" -U tsdhn \
    --auth-host=trust --auth-local=trust --no-instructions
fi
"""

[tasks."db:start"]
description = "Start the project-local PostgreSQL cluster"
depends = ["db:init"]
run = """
data_dir="$PWD/.data/postgres"
pg_port="${TSDHN_PG_PORT:-5432}"

project_server_running=0
if mise x postgres -- pg_ctl -D "$data_dir" status >/dev/null 2>&1; then
  project_server_running=1
fi

port_open=0
if nc -z -w 1 127.0.0.1 "$pg_port" >/dev/null 2>&1; then
  port_open=1
fi

if [ "$project_server_running" -eq 0 ] && [ "$port_open" -eq 1 ]; then
  echo "PostgreSQL port $pg_port is already in use by another server; set TSDHN_PG_PORT to an unused port." >&2
  exit 1
fi

if [ "$project_server_running" -eq 0 ]; then
  mise x postgres -- pg_ctl -D "$data_dir" \
    -l "$data_dir/server.log" \
    -o "-h 127.0.0.1 -p $pg_port -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \
    -w start
fi

if ! PGPASSWORD="${PGPASSWORD:-}" mise x postgres -- psql -w -h 127.0.0.1 -p "$pg_port" -U tsdhn -d tsdhn -qAtc "SELECT 1" >/dev/null 2>&1; then
  PGPASSWORD="${PGPASSWORD:-}" mise x postgres -- createdb -w -h 127.0.0.1 -p "$pg_port" -U tsdhn tsdhn
fi
"""

[tasks."db:stop"]
description = "Stop the project-local PostgreSQL cluster"
run = """
data_dir="$PWD/.data/postgres"
mise x postgres -- pg_ctl -D "$data_dir" stop -m fast -w 2>/dev/null || true
"""

[tasks."db:reset"]
description = "Delete the project-local PostgreSQL cluster"
run = """
mise run db:stop
rm -rf "$PWD/.data/postgres"
"""

[tasks."db:migrate"]
description = "Apply compute, queue, and web migrations to local PostgreSQL"
depends = ["db:start"]
env = { _ = { file = ".env" } }
run = [
  "uv run tsdhn-compute-migrate",
  "uv run rqueue --database-url \"${COMPUTE_DATABASE_URL:-postgresql://tsdhn:tsdhn@127.0.0.1:${TSDHN_PG_PORT:-5432}/tsdhn}\" --schema \"${COMPUTE_QUEUE_SCHEMA:-task_queue}\" migrate",
  "uv run tsdhn-queue-grants",
  "DATABASE_URL=\"${COMPUTE_DATABASE_URL:-postgresql://tsdhn:tsdhn@127.0.0.1:${TSDHN_PG_PORT:-5432}/tsdhn}\" bun --filter web db:migrate",
  "uv run tsdhn-web-grants",
]
