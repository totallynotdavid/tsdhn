[project]
name = "tsdhn-api"
version = "0.2.0"
description = "TSDHN FastAPI service and rqueue simulation worker"
requires-python = ">=3.14"
readme = "readme.md"
license = { text = "MIT" }
authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" },
]
dependencies = [
    "tsdhn",
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "anyio>=4.15.1",
    "psycopg[binary]>=3.3.6",
    "minio>=7.2.20",
    "asyncpg>=0.32.0",
    "rqueue",
]

[project.scripts]
tsdhn-api = "api.main:start_app"
tsdhn-worker = "api.worker:main"
tsdhn-compute-migrate = "api.migrate:main"
tsdhn-web-grants = "api.web_grants:main"
tsdhn-queue-grants = "api.queue_grants:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = ""

[tool.uv.sources]
rqueue = { git = "https://github.com/totallynotdavid/transactions.git", rev = "eaa7a807d85c6d752512fc05f5fbe04dab23f3b8" }
