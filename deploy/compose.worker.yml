# A worker host. It runs the worker and nothing else, and reads PostgreSQL over
# the private network and the output bucket over the internet. Every setting
# comes from /etc/tsdhn/worker.env; see docs/deploy.md. Compose refuses to start
# when a required value is missing.
name: tsdhn-worker

services:
  worker:
    image: ${API_IMAGE:?set API_IMAGE in the env file}
    restart: unless-stopped
    # The default worker id carries the host name, not the container's.
    uts: host
    environment:
      COMPUTE_RUNTIME_DATABASE_URL: ${COMPUTE_RUNTIME_DATABASE_URL:?set COMPUTE_RUNTIME_DATABASE_URL in the env file}
      COMPUTE_QUEUE: ${COMPUTE_QUEUE:-simulations}
      COMPUTE_QUEUE_SCHEMA: ${COMPUTE_QUEUE_SCHEMA:-task_queue}
      TSDHN_S3_ENDPOINT: ${TSDHN_S3_ENDPOINT:?set TSDHN_S3_ENDPOINT in the env file}
      TSDHN_S3_SECURE: ${TSDHN_S3_SECURE:-false}
      TSDHN_S3_REGION: ${TSDHN_S3_REGION:-us-east-1}
      TSDHN_S3_ACCESS_KEY: ${TSDHN_S3_ACCESS_KEY:?set TSDHN_S3_ACCESS_KEY in the env file}
      TSDHN_S3_SECRET_KEY: ${TSDHN_S3_SECRET_KEY:?set TSDHN_S3_SECRET_KEY in the env file}
      TSDHN_S3_BUCKET: ${TSDHN_S3_BUCKET:-tsdhn-results}
      TSDHN_MODEL_DIR: /app/model
      TSDHN_JOBS_DIR: /var/tmp/jobs
      TSDHN_WORKER_HEARTBEAT_FILE: /var/tmp/worker-heartbeat
      TSDHN_WORKER_ID: ${TSDHN_WORKER_ID:-}
      TSDHN_WORKER_CONCURRENCY: ${TSDHN_WORKER_CONCURRENCY:-1}
      TSDHN_NUMBA_THREADS: ${TSDHN_NUMBA_THREADS:-}
      COMPUTE_WORKER_ROLE: ${COMPUTE_WORKER_ROLE:-tsdhn_worker}
      COMPUTE_WORKER_PASSWORD: ${COMPUTE_WORKER_PASSWORD:?set COMPUTE_WORKER_PASSWORD in the env file}
      # The main host deletes expired outputs and finished queue rows. This
      # host holds no purger credential.
      TSDHN_RETENTION_ENABLED: "false"
    command: ["uv", "run", "--no-dev", "tsdhn-worker"]
    volumes:
      - jobs-data:/var/tmp/jobs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /var/tmp/worker-heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  jobs-data:
