name: Release

# A pull request or a manual run is a dry run. It builds every artifact and
# checks every upload with a dry-run mode. It skips only publishing steps
# without one. Those steps name the tag ref in their `if:`.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# Default: no permissions.
# Each job opts into what it needs.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_BRANCH_TAG: master

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every environment named by a job must be checked below.
      - name: Check the workflow names no unchecked environment
        run: |
          set -euo pipefail
          checked="pypi"
          named="$(sed -n 's/^    environment: *//p' .github/workflows/release.yml | sort -u)"
          for environment in $named; do
              case " $checked " in
                  *" $environment "*) ;;
                  *)
                      echo "::error::Job environment '$environment' has no preflight check."
                      exit 1
                      ;;
              esac
          done

      - name: Check the pypi environment exists
        if: vars.PUBLISH_PYPI == 'true'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" --jq '"environment " + .name + " exists"'

      - name: Report PyPI publishing as skipped
        if: vars.PUBLISH_PYPI != 'true'
        run: |
          message="PyPI publishing is skipped: the repository variable PUBLISH_PYPI is not 'true'. The pypi environment and the trusted publisher were not checked."
          echo "::notice title=PyPI skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  build-sdist-wheels:
    name: Build sdist + wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/tsdhn/pyproject.toml)"
          if [ "$tag_version" != "$manifest_version" ]; then
              echo "Tag v$tag_version does not match the tsdhn package version $manifest_version."
              exit 1
          fi

      # Without a tag, the manifest version stands in for the tag version.
      - name: Check the release notes name the version
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/tsdhn/pyproject.toml)"
          expected="tsdhn ${manifest_version} is out."
          first_line="$(head -n 1 .github/release-notes.md)"
          if [ "$first_line" != "$expected" ]; then
              echo "The first line of .github/release-notes.md must be: $expected"
              echo "Found: $first_line"
              exit 1
          fi

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          install_args: python uv

      - run: mise run build:py

      # The tag run uploads with pypa/gh-action-pypi-publish, which has no dry-run mode.
      - name: Check the PyPI upload (dry run)
        run: mise exec -- uv publish --dry-run --trusted-publishing never dist/tsdhn/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: |
            dist/tsdhn/*
            dist/api/*

  build-model-assets:
    name: Build model asset bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build model archive
        run: |
          set -euo pipefail
          mkdir -p dist/model
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/tsdhn/pyproject.toml)"
          export VERSION
          archive="dist/model/tsdhn-model-v${VERSION}.tar.gz"
          tar -czf "$archive" -C model .
          sha256sum "$archive" > "${archive}.sha256"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          files = sorted(str(path.relative_to("model")) for path in Path("model").rglob("*") if path.is_file())
          manifest = {
              "version": version,
              "model_schema": 1,
              "source_commit": os.environ["GITHUB_SHA"],
              "files": files,
          }
          Path(f"dist/model/tsdhn-model-manifest-v{version}.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload model assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: model-assets
          path: dist/model/*

  # Later jobs pull candidate images, so fork pull requests skip image jobs
  # because their tokens cannot write packages.
  build-toolchain-image:
    name: Build candidate Docker (toolchain)
    needs: build-sdist-wheels
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/tsdhn-toolchain
          tags: |
            type=raw,value=${{ env.CANDIDATE_TAG }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/toolchain.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Attest candidate image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/tsdhn-toolchain
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          show-summary: false

  build-app-images:
    name: Build candidate Docker (${{ matrix.target }})
    needs: [build-sdist-wheels, build-toolchain-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: tsdhn-api
            dockerfile: deploy/api.Dockerfile
            cache_scope: api
          - target: web
            image: tsdhn-web
            dockerfile: deploy/web.Dockerfile
            cache_scope: web
          - target: backup
            image: tsdhn-backup
            dockerfile: deploy/backup.Dockerfile
            cache_scope: backup
          - target: development
            image: tsdhn-dev
            dockerfile: .devcontainer/Dockerfile
            cache_scope: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          install_args: uv bun

      - name: Resolve build args
        id: args
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
              echo "list<<EOF"
              case "$TARGET" in
                  api)
                      echo "TOOLCHAIN_IMAGE=$IMAGE_REGISTRY/tsdhn-toolchain:$CANDIDATE_TAG"
                      echo "UV_VERSION=$(mise current uv)"
                      ;;
                  web)
                      echo "BUN_VERSION=$(mise current bun)"
                      ;;
                  development)
                      echo "TOOLCHAIN_IMAGE=$IMAGE_REGISTRY/tsdhn-toolchain:$CANDIDATE_TAG"
                      ;;
              esac
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.CANDIDATE_TAG }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          platforms: linux/amd64
          provenance: true
          sbom: true

      - name: Attest candidate image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          show-summary: false

  compose-smoke:
    name: Compose smoke candidate images
    needs: build-app-images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/tsdhn-api:candidate-${{ github.run_id }}-${{ github.run_attempt }}
      TOOLCHAIN_IMAGE: ghcr.io/${{ github.repository_owner }}/tsdhn-toolchain:candidate-${{ github.run_id }}-${{ github.run_attempt }}
      SIMULATION_ID: 4cfe522f-7e7d-46e0-96ca-7b98743fb9f5
      COMPUTE_API_TOKEN: compose-e2e-token
      APP_DB_PASSWORD: compose-e2e-app-db-password
      COMPUTE_PRODUCER_PASSWORD: compose-e2e-producer-password
      COMPUTE_WORKER_PASSWORD: compose-e2e-worker-password
      COMPUTE_PURGER_PASSWORD: compose-e2e-purger-password
      BETTER_AUTH_SECRET: compose-e2e-better-auth-secret
      ORIGIN: http://localhost:3000
      TSDHN_S3_ACCESS_KEY: tsdhn-local
      TSDHN_S3_SECRET_KEY: tsdhn-local-secret
      TSDHN_S3_BUCKET: tsdhn-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate runtime image
        run: docker pull "$API_IMAGE"

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Start compute stack from candidate images
        run: docker compose up -d --no-build postgres storage compute-migrate api worker

      - name: Run compute smoke test
        run: bash scripts/e2e/compute_stack_smoke.sh

      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p e2e-artifacts
          docker compose ps -a > e2e-artifacts/compose-ps.txt || true
          docker compose logs --no-color > e2e-artifacts/compose.log || true
          cp -f ./*.json ./*.jsonl ./*.txt e2e-artifacts/ 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compose-smoke-diagnostics
          path: e2e-artifacts
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  promote-images:
    name: Promote Docker images
    needs: compose-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGES: tsdhn-toolchain tsdhn-api tsdhn-web tsdhn-backup tsdhn-dev
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"

      - name: Check the tested candidates exist
        run: |
          set -euo pipefail
          for image in $IMAGES; do
              docker buildx imagetools inspect "${IMAGE_REGISTRY}/${image}:${CANDIDATE_TAG}" > /dev/null
              echo "found ${image}:${CANDIDATE_TAG}"
          done

      - name: Promote tested candidates
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"

          for image in $IMAGES; do
              source_ref="${IMAGE_REGISTRY}/${image}:${CANDIDATE_TAG}"
              release_ref="${IMAGE_REGISTRY}/${image}:${GITHUB_REF_NAME}"
              branch_ref="${IMAGE_REGISTRY}/${image}:${RELEASE_BRANCH_TAG}"
              sha_ref="${IMAGE_REGISTRY}/${image}:sha-${short_sha}"

              docker buildx imagetools create \
                  -t "$release_ref" \
                  -t "$branch_ref" \
                  -t "$sha_ref" \
                  "$source_ref"

              cosign sign --yes "$release_ref" "$branch_ref" "$sha_ref"
          done

  # Trusted publishing requires the pypi environment and a PyPI publisher.
  # Only tag runs enter the environment. Dry runs check uploads earlier.
  publish-pypi:
    name: Publish to PyPI
    needs: [build-sdist-wheels, promote-images]

    # Only publish when PyPI trusted publishing is explicitly configured.
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      attestations: write

    environment: pypi

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Attest PyPI artifacts (SLSA build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/**/*.tar.gz,dist/**/*.whl
          show-summary: false

      - name: Publish tsdhn
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/tsdhn

  release-notes:
    name: Create GitHub release
    needs: [build-model-assets, promote-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download model assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: model-assets
          path: dist/model

      - name: Check the release files
        run: |
          set -euo pipefail
          test -s .github/release-notes.md
          ls -l dist/model

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/model/*
