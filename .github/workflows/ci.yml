name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # A pull request that changes only documentation skips the code jobs. A
  # skipped job reports as skipped, so a required check is never left pending.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/changes.py ci | tee -a "$GITHUB_OUTPUT"

  docs:
    name: Docs format
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: mise run lint:web

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TSDHN_MODEL_DIR: ${{ github.workspace }}/model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install GMT (libgmt) and Ghostscript for pygmt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gmt libgmt-dev ghostscript
          SO=$(find /usr/lib -type f -name 'libgmt.so.*' -print -quit)
          if [ -z "$SO" ]; then
              echo "::error::libgmt.so.* not found after apt install"
              find /usr/lib -iname '*gmt*' -print || true
              exit 1
          fi
          sudo ln -sf "$SO" "$(dirname "$SO")/libgmt.so"

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: mise run install
      - run: mise run check

      - name: Check the API client has no drift
        if: ${{ !cancelled() }}
        run: |
          mise run gen:client
          if ! git diff --quiet libs/api-client; then
              echo "::error::@tsdhn/api-client is stale. Run 'mise run gen:client' and commit."
              git diff libs/api-client
              exit 1
          fi

      - name: Name coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then
              mv .coverage .coverage.unit
          fi

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-data-unit
          path: |
            .coverage.unit
            apps/web/coverage/lcov.info
          include-hidden-files: true
          if-no-files-found: ignore

  integration:
    name: Persistence integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: tsdhn
          POSTGRES_PASSWORD: tsdhn
          POSTGRES_DB: tsdhn
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: mise run install

      - name: Run disposable database integration tests
        run: mise run test:integration -- --coverage
        env:
          COMPUTE_DATABASE_URL: postgresql://tsdhn:tsdhn@localhost:5432/tsdhn

      - name: Name coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then
              mv .coverage .coverage.integration
          fi

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Diff coverage gates
    runs-on: ubuntu-latest
    needs: [changes, check, integration]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch master for the diff base
        run: git fetch origin master:refs/remotes/origin/master

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - run: mise run install

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - run: mise run coverage:merge

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - run: mise run diff-coverage:py
      - run: mise run diff-coverage:web

      - name: Report diff coverage
        if: always()
        run: |
          for report in diff-coverage.md diff-coverage-web.md; do
              if [ -f "$report" ]; then
                  cat "$report" >> "$GITHUB_STEP_SUMMARY"
              fi
          done

      - name: Upload HTML coverage report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: html-coverage-report
          path: htmlcov
