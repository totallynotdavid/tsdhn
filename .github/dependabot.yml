version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: >-
          @redocly/openapi-core
      - dependency-name: effect
      - dependency-name: typescript

  - package-ecosystem: uv
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: >-
          @redocly/openapi-core
      - dependency-name: effect
      - dependency-name: typescript

  - package-ecosystem: docker
    directories:
      - /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: >-
          @redocly/openapi-core
      - dependency-name: effect
      - dependency-name: typescript

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: >-
          @redocly/openapi-core
      - dependency-name: effect
      - dependency-name: typescript

  - package-ecosystem: devcontainers
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: >-
          @redocly/openapi-core
      - dependency-name: effect
      - dependency-name: typescript
