services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsdhn
      POSTGRES_USER: tsdhn
      POSTGRES_PASSWORD: tsdhn
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsdhn -d tsdhn"]
      interval: 10s
      timeout: 3s
      retries: 5

  storage:
    image: docker.io/rustfs/rustfs:1.0.1
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${TSDHN_S3_ACCESS_KEY:-tsdhn-local}
      RUSTFS_SECRET_KEY: ${TSDHN_S3_SECRET_KEY:-tsdhn-local-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  compute-migrate:
    image: ${API_IMAGE:-tsdhn-api:local}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COMPUTE_DATABASE_URL: postgresql://tsdhn:tsdhn@postgres:5432/tsdhn
      COMPUTE_QUEUE: ${COMPUTE_QUEUE:-simulations}
      COMPUTE_QUEUE_SCHEMA: ${COMPUTE_QUEUE_SCHEMA:-task_queue}
      APP_DB_ROLE: ${APP_DB_ROLE:-tsdhn_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      COMPUTE_PRODUCER_ROLE: ${COMPUTE_PRODUCER_ROLE:-tsdhn_producer}
      COMPUTE_PRODUCER_PASSWORD: ${COMPUTE_PRODUCER_PASSWORD:?set COMPUTE_PRODUCER_PASSWORD in .env}
      COMPUTE_WORKER_ROLE: ${COMPUTE_WORKER_ROLE:-tsdhn_worker}
      COMPUTE_WORKER_PASSWORD: ${COMPUTE_WORKER_PASSWORD:?set COMPUTE_WORKER_PASSWORD in .env}
      COMPUTE_PURGER_ROLE: ${COMPUTE_PURGER_ROLE:-tsdhn_purger}
      COMPUTE_PURGER_PASSWORD: ${COMPUTE_PURGER_PASSWORD:?set COMPUTE_PURGER_PASSWORD in .env}
    command:
      [
        "sh",
        "-lc",
        "uv run --no-dev tsdhn-compute-migrate && uv run --no-dev rqueue --database-url \"$$COMPUTE_DATABASE_URL\" --schema \"$$COMPUTE_QUEUE_SCHEMA\" migrate && uv run --no-dev tsdhn-queue-grants",
      ]
    restart: "no"

  api:
    image: ${API_IMAGE:-tsdhn-api:local}
    pull_policy: missing
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      args:
        TOOLCHAIN_IMAGE: ${TOOLCHAIN_IMAGE:-ghcr.io/totallynotdavid/tsdhn-toolchain:master}
        UV_VERSION:
    restart: unless-stopped
    depends_on:
      compute-migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    environment:
      COMPUTE_RUNTIME_DATABASE_URL: postgresql://postgres:5432/tsdhn
      COMPUTE_QUEUE: ${COMPUTE_QUEUE:-simulations}
      COMPUTE_QUEUE_SCHEMA: ${COMPUTE_QUEUE_SCHEMA:-task_queue}
      TSDHN_S3_ENDPOINT: storage:9000
      TSDHN_S3_PUBLIC_ENDPOINT: ${TSDHN_S3_PUBLIC_ENDPOINT:-localhost:9000}
      TSDHN_S3_ACCESS_KEY: ${TSDHN_S3_ACCESS_KEY:-tsdhn-local}
      TSDHN_S3_SECRET_KEY: ${TSDHN_S3_SECRET_KEY:-tsdhn-local-secret}
      TSDHN_S3_BUCKET: ${TSDHN_S3_BUCKET:-tsdhn-results}
      COMPUTE_API_TOKEN: ${COMPUTE_API_TOKEN:?set COMPUTE_API_TOKEN in .env}
      TSDHN_ALLOWED_ORIGINS: ${TSDHN_ALLOWED_ORIGINS:-}
      COMPUTE_PRODUCER_ROLE: ${COMPUTE_PRODUCER_ROLE:-tsdhn_producer}
      COMPUTE_PRODUCER_PASSWORD: ${COMPUTE_PRODUCER_PASSWORD:?set COMPUTE_PRODUCER_PASSWORD in .env}
    ports:
      - "8000:8000"

  worker:
    image: ${API_IMAGE:-tsdhn-api:local}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      compute-migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    environment:
      COMPUTE_RUNTIME_DATABASE_URL: postgresql://postgres:5432/tsdhn
      COMPUTE_QUEUE: ${COMPUTE_QUEUE:-simulations}
      COMPUTE_QUEUE_SCHEMA: ${COMPUTE_QUEUE_SCHEMA:-task_queue}
      TSDHN_S3_ENDPOINT: storage:9000
      TSDHN_S3_ACCESS_KEY: ${TSDHN_S3_ACCESS_KEY:-tsdhn-local}
      TSDHN_S3_SECRET_KEY: ${TSDHN_S3_SECRET_KEY:-tsdhn-local-secret}
      TSDHN_S3_BUCKET: ${TSDHN_S3_BUCKET:-tsdhn-results}
      TSDHN_MODEL_DIR: /app/model
      TSDHN_JOBS_DIR: /var/tmp/jobs
      COMPUTE_WORKER_ROLE: ${COMPUTE_WORKER_ROLE:-tsdhn_worker}
      COMPUTE_WORKER_PASSWORD: ${COMPUTE_WORKER_PASSWORD:?set COMPUTE_WORKER_PASSWORD in .env}
      COMPUTE_PURGER_ROLE: ${COMPUTE_PURGER_ROLE:-tsdhn_purger}
      COMPUTE_PURGER_PASSWORD: ${COMPUTE_PURGER_PASSWORD:?set COMPUTE_PURGER_PASSWORD in .env}
    command: ["uv", "run", "--no-dev", "tsdhn-worker"]
    volumes:
      - jobs-data:/var/tmp/jobs

  web-migrate:
    image: ${WEB_IMAGE:-tsdhn-web:local}
    pull_policy: never
    profiles: ["web"]
    depends_on:
      compute-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://tsdhn:tsdhn@postgres:5432/tsdhn
    command: ["bun", "run", "db:migrate"]
    restart: "no"

  web-grants:
    image: ${API_IMAGE:-tsdhn-api:local}
    pull_policy: never
    profiles: ["web"]
    depends_on:
      web-migrate:
        condition: service_completed_successfully
    environment:
      COMPUTE_DATABASE_URL: postgresql://tsdhn:tsdhn@postgres:5432/tsdhn
      APP_DB_ROLE: ${APP_DB_ROLE:-tsdhn_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    command: ["uv", "run", "--no-dev", "tsdhn-web-grants"]
    restart: "no"

  web:
    image: ${WEB_IMAGE:-tsdhn-web:local}
    pull_policy: missing
    profiles: ["web"]
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        BUN_VERSION:
    restart: unless-stopped
    depends_on:
      web-grants:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      COMPUTE_API_URL: http://api:8000
      COMPUTE_API_TOKEN: ${COMPUTE_API_TOKEN:?set COMPUTE_API_TOKEN in .env}
      DATABASE_URL: postgresql://${APP_DB_ROLE:-tsdhn_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/tsdhn
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  storage-data:
  jobs-data:
